version: "0.7.0"
kind: app
app:
  name: "错误：两个 End 输出变量重名"
  mode: workflow
  icon: "❌"
  icon_type: emoji
  icon_background: "#FEE2E2"
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  environment_variables: []
  conversation_variables: []
  features: {}
  graph:
    nodes:
      - id: "1770000000001"
        type: custom
        data:
          type: start
          title: "开始"
          variables:
            - label: "输入"
              variable: q
              type: text-input
              required: true
        position: {x: 80, y: 282}
        width: 244
        height: 90
      - id: "1770000000002"
        type: custom
        data:
          type: end
          title: "通过"
          outputs:
            - variable: result
              value_selector: ["1770000000001", "q"]
              value_type: string
        position: {x: 380, y: 200}
        width: 244
        height: 90
      - id: "1770000000003"
        type: custom
        data:
          type: end
          title: "退回"
          outputs:
            - variable: result
              value_selector: ["1770000000001", "q"]
              value_type: string
        position: {x: 380, y: 400}
        width: 244
        height: 90
    edges:
      - id: 1770000000001-source-1770000000002-target
        source: "1770000000001"
        sourceHandle: source
        target: "1770000000002"
        targetHandle: target
        type: custom
        zIndex: 0
        data: {sourceType: start, targetType: end}
      - id: 1770000000001-source-1770000000003-target
        source: "1770000000001"
        sourceHandle: source
        target: "1770000000003"
        targetHandle: target
        type: custom
        zIndex: 0
        data: {sourceType: start, targetType: end}
    viewport: {x: 0, y: 0, zoom: 0.7}
