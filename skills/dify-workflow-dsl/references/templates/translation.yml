version: "0.7.0"
kind: app
app:
  name: "批量翻译"
  description: "Start -> LLM -> End 的最小 Workflow 骨架（带输入变量）"
  icon: "🌐"
  icon_type: emoji
  icon_background: "#DCFCE7"
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
      - id: n_start
        type: custom
        data:
          type: start
          title: "输入"
          variables:
            - label: "原文"
              variable: source_text
              type: paragraph
              required: true
              max_length: 10000
            - label: "目标语言"
              variable: target_language
              type: select
              required: true
              options: ["英文", "日文", "德文"]
        position: {x: 80, y: 282}
        positionAbsolute: {x: 80, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 54
      - id: n_llm
        type: custom
        data:
          type: llm
          title: "翻译"
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - id: 1b9e3d5f-0001-4c00-9000-000000000001
              role: system
              text: "你是专业译者。只输出译文，不要解释。"
            - id: 1b9e3d5f-0002-4c00-9000-000000000002
              role: user
              text: "把下面的文本翻译成 {{#n_start.target_language#}}：\n\n{{#n_start.source_text#}}"
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          selected: false
        position: {x: 380, y: 282}
        positionAbsolute: {x: 380, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 98
      - id: n_end
        type: custom
        data:
          type: end
          title: "输出"
          outputs:
            - variable: translated
              value_selector: ["n_llm", "text"]
              value_type: string
        position: {x: 680, y: 282}
        positionAbsolute: {x: 680, y: 282}
        sourcePosition: right
        targetPosition: left
        width: 244
        height: 90
    edges:
      - id: n_start-source-n_llm-target
        source: n_start
        sourceHandle: source
        target: n_llm
        targetHandle: target
        type: custom
        zIndex: 0
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
      - id: n_llm-source-n_end-target
        source: n_llm
        sourceHandle: source
        target: n_end
        targetHandle: target
        type: custom
        zIndex: 0
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
    viewport:
      x: 0
      y: 0
      zoom: 0.7
